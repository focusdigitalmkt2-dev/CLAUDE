# Diagnóstico de velocidade do site publicado (execução manual)
name: Diagnóstico de velocidade

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL a medir
        default: https://secretarias-focus.vercel.app/
        required: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Cabeçalhos e tempos de resposta (5 amostras)
        run: |
          URL="${{ github.event.inputs.url }}"
          echo "== HEADERS"; curl -sS -D - -o /dev/null -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Safari/604.1" "$URL" | sed -n '1,40p'
          echo "== TIMINGS"
          for i in 1 2 3 4 5; do
            curl -sS -o /dev/null -H "Accept-Encoding: gzip, br" -w "dns=%{time_namelookup}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B code=%{http_code}\n" "$URL"
          done
          echo "== VSL MP4"
          curl -sSI "${URL%/}/video/vsl.mp4" | grep -iE "^(HTTP|content-type|content-length|accept-ranges|cache-control|x-vercel-cache)" || echo "sem /video/vsl.mp4 (site usa YouTube)"
          curl -sS -o /dev/null -r 0-1048575 -w "primeiro 1 MB do vídeo: %{time_total}s (HTTP %{http_code})\n" "${URL%/}/video/vsl.mp4" || true
          echo "== VSL HLS"
          curl -sSI "${URL%/}/video/hls/master.m3u8" | grep -iE "^(HTTP|content-type|cache-control)" || echo "sem HLS"
          curl -sS "${URL%/}/video/hls/master.m3u8" | head -8 || true
          curl -sS -o /dev/null -w "1º segmento 720p: %{time_total}s %{size_download}B (HTTP %{http_code})\n" "${URL%/}/video/hls/720p/seg_0000.m4s" || true
          echo "== ASSETS"
          curl -sS "$URL" | grep -oE '(src|href)="[^"]+\.(js|css|woff2|png|jpg)[^"]*"' | sed 's/^[a-z]*=//' | tr -d '"' | sort -u | head -30 | while read a; do
            case "$a" in http*) u="$a";; *) u="${URL%/}$a";; esac
            curl -sS -o /dev/null -H "Accept-Encoding: gzip, br" -w "  %{time_total}s %{size_download}B %{http_code} $u\n" "$u"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (celular, 3 amostras, simulado e observado)
        run: |
          for n in 1 2 3; do
            npx -y lighthouse "${{ github.event.inputs.url }}" --quiet --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --screenEmulation.mobile --output=json --output-path=./lh$n.json || true
          done
          node -e '
            for (const n of [1,2,3]) {
              const r=require("./lh"+n+".json"); const a=r.audits; const ms=(k)=>Math.round(a[k].numericValue);
              const obs=(a.metrics.details.items||[])[0]||{};
              console.log("--- amostra", n, "| score", Math.round(r.categories.performance.score*100));
              console.log("simulado: FCP", ms("first-contentful-paint"), "| LCP", ms("largest-contentful-paint"), "| TBT", ms("total-blocking-time"), "| SI", ms("speed-index"));
              console.log("observado: FCP", obs.observedFirstContentfulPaint, "| LCP", obs.observedLargestContentfulPaint, "| load", obs.observedLoad, "| DCL", obs.observedDomContentLoaded);
              const lcp=a["largest-contentful-paint-element"]?.details?.items?.[0]?.items?.[0]?.node;
              if (lcp) console.log("LCP element:", (lcp.snippet||"").slice(0,120));
              const rb=a["render-blocking-resources"]?.details?.items||[]; if (rb.length) console.log("render-blocking:", rb.map(i=>i.url.slice(0,90)+" "+Math.round(i.wastedMs)+"ms").join(" ; "));
            }
            const r=require("./lh1.json"); const items=(r.audits["network-requests"].details.items||[]).sort((x,y)=>(y.transferSize||0)-(x.transferSize||0)).slice(0,12);
            console.log("Maiores transferências:"); for (const it of items) console.log(" ", Math.round((it.transferSize||0)/1024)+"KB", it.url.slice(0,100));
          '

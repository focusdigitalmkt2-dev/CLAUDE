# Deploy automático na Vercel a cada push na branch da landing page.
# Requer o secret VERCEL_TOKEN no repositório:
#   Settings → Secrets and variables → Actions → New repository secret
# O projeto é criado/vinculado automaticamente no time da Focus na Vercel.
name: Deploy landing page (Vercel)

on:
  push:
    branches: [claude/landing-page-secretarias-s4yy4w]
    paths: ["secretarias-alta-performance/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: focusdigitalmkt2-5069s-projects
  VERCEL_PROJECT: secretarias-alta-performance
  # Domínio curto (alias) apontado para a produção. Candidatos em ordem de preferência.
  SHORT_DOMAINS: "secretarias-focus.vercel.app secretariasfocus.vercel.app focus-secretarias.vercel.app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secretarias-alta-performance
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secret VERCEL_TOKEN
        run: |
          # remove espaços e quebras de linha coladas junto com o token
          token="$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::Secret VERCEL_TOKEN não configurado no repositório."; exit 1
          fi
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vincular projeto na Vercel
        run: npx vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Liberar acesso público (desativa Vercel Authentication)
        run: |
          curl -sS -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?slug=$VERCEL_SCOPE" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('ssoProtection:', d.get('ssoProtection'), '| erro:', d.get('error'))"
      - name: Capa da VSL servida pelo próprio site
        run: |
          id=$(grep -oE 'youtubeId: "[^"]+"' src/lib/config.ts | cut -d'"' -f2)
          curl -sSf "https://i.ytimg.com/vi/$id/maxresdefault.jpg" -o /tmp/poster.jpg \
            || curl -sSf "https://i.ytimg.com/vi/$id/sddefault.jpg" -o /tmp/poster.jpg || true
          if [ -s /tmp/poster.jpg ]; then
            # reduz para 960px de largura e qualidade 72: ~40 KB em vez de ~100 KB
            # (o runner não tem ImageMagick; usa o sharp instalado numa pasta temporária)
            npm install --prefix /tmp/sharp --no-save --silent sharp@0.34 >/dev/null 2>&1 || true
            SHARP_PATH=/tmp/sharp/node_modules/sharp node scripts/compress-poster.mjs /tmp/poster.jpg public/images/vsl-poster.jpg \
              || cp /tmp/poster.jpg public/images/vsl-poster.jpg
          fi
          ls -la public/images/vsl-poster.jpg || echo "capa não baixada; o site usa a do YouTube"
      # Opcional, recomendado: VSL em MP4 servida pelo próprio site (player nativo,
      # abre mais rápido e toca com som no primeiro toque em qualquer celular).
      # Defina a variável/secret VSL_MP4_URL no repositório (Settings → Secrets and
      # variables → Actions) com um link direto do arquivo ou um link compartilhado
      # do Google Drive ("qualquer pessoa com o link"). Sem ela, o site usa o YouTube.
      # Alternativa: MP4 já hospedado em outro servidor (ex.: domínio próprio na Hostinger).
      # Defina NEXT_PUBLIC_VSL_MP4 (variável do repositório) ou vsl.mp4Url em src/lib/config.ts
      # com a URL https direta do arquivo. Nada é baixado; só conferimos se o servidor
      # entrega o vídeo em partes (Accept-Ranges), que é o que faz ele começar na hora.
      - name: VSL em MP4 hospedada fora (opcional)
        env:
          DIRECT_URL: ${{ vars.NEXT_PUBLIC_VSL_MP4 }}
        run: |
          url="$DIRECT_URL"
          if [ -z "$url" ]; then
            url=$(grep -oE 'mp4Url: env\("NEXT_PUBLIC_VSL_MP4", "[^"]*"\)' src/lib/config.ts | grep -oE '"https?://[^"]+"' | tr -d '"' || true)
          fi
          [ -n "$url" ] || { echo "Sem MP4 externo configurado."; exit 0; }
          echo "MP4 externo: $url"
          h=$(curl -sSIL --max-time 30 "$url" | tr -d '\r' | tr 'A-Z' 'a-z')
          echo "$h" | grep -E "^(http/|content-type|content-length|accept-ranges)" || true
          echo "$h" | grep -q "^content-type: video/" || echo "::warning::O servidor não respondeu content-type video/*: confira a URL"
          echo "$h" | grep -q "^accept-ranges: bytes" || echo "::warning::Sem Accept-Ranges: o vídeo pode demorar para começar e não permitir avançar"
          case "$url" in https://*) ;; *) echo "::error::A URL do MP4 precisa ser https (conteúdo misto é bloqueado)"; exit 1;; esac
          if [ -n "$DIRECT_URL" ]; then
            echo "VSL_BUILD_ENV=--build-env NEXT_PUBLIC_VSL_MP4=$DIRECT_URL" >> "$GITHUB_ENV"
          fi
      - name: VSL em MP4 (opcional)
        env:
          # Link do Google Drive da VSL ("qualquer pessoa com o link"). Pode ser trocado por secret/variável.
          VSL_MP4_URL: ${{ secrets.VSL_MP4_URL || vars.VSL_MP4_URL || 'https://drive.google.com/file/d/1T4U9ON_--kVlOHVbmqVaRGvxHKJgVE0C/view' }}
        run: |
          if [ -z "$VSL_MP4_URL" ]; then
            echo "VSL_MP4_URL não definido: o site usa o MP4 externo (se houver) ou o YouTube."; exit 0
          fi
          url="$VSL_MP4_URL"
          # o runner do GitHub não traz ffmpeg; instala (apt) ou usa o binário estático
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "Instalando ffmpeg..."
            (sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1) || {
              curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz
              mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
              sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
            }
          fi
          ffmpeg -version | head -1
          echo "Baixando a VSL..."
          rm -f /tmp/vsl-src
          if echo "$url" | grep -q "drive.google.com"; then
            # arquivos grandes no Drive: link direto com confirm=t; plano B: gdown
            fid=$(echo "$url" | grep -oE '/d/[^/?]+|id=[^&]+' | head -1 | sed -E 's#^/d/##; s#^id=##')
            curl -sSL --retry 3 --max-time 900 "https://drive.usercontent.google.com/download?id=$fid&export=download&confirm=t" -o /tmp/vsl-src || true
            if [ ! -s /tmp/vsl-src ] || [ "$(stat -c %s /tmp/vsl-src)" -lt 1000000 ]; then
              pip install -q --disable-pip-version-check gdown >/dev/null 2>&1 || true
              gdown --quiet "https://drive.google.com/uc?id=$fid" -O /tmp/vsl-src || true
            fi
          else
            curl -sSL --retry 3 --max-time 900 "$url" -o /tmp/vsl-src || true
          fi
          if [ ! -s /tmp/vsl-src ]; then
            echo "::warning::Não foi possível baixar a VSL; o site usa o YouTube."; exit 0
          fi
          echo "Baixado: $(du -h /tmp/vsl-src | cut -f1) | tipo: $(file -b /tmp/vsl-src | cut -c1-80)"
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/vsl-src 2>/tmp/ffprobe.err | cut -d. -f1 || true)
          case "$dur" in ''|N/A|*[!0-9]*) dur=0;; esac
          if [ "$dur" -le 0 ]; then
            echo "ffprobe: $(head -c 600 /tmp/ffprobe.err)"
            echo "índice (moov) no fim do arquivo: $(tail -c 4000000 /tmp/vsl-src | grep -c moov || true) | no início: $(head -c 4000000 /tmp/vsl-src | grep -c moov || true)"
            echo "Início do conteúdo recebido:"; head -c 200 /tmp/vsl-src | tr -d '\0' | strings -n 3 | head -8; echo
            echo "::warning::O arquivo não é um vídeo válido/completo; o site usa o YouTube."; exit 0
          fi
          # bitrate para o arquivo caber em ~85 MB, no máximo 1400 kbps (720p)
          vb=$(( 680000 / dur )); if [ "$vb" -gt 1400 ]; then vb=1400; fi
          mkdir -p public/video
          echo "Origem: $(du -h /tmp/vsl-src | cut -f1), ${dur}s → convertendo para 720p a ${vb} kbps (pode levar alguns minutos)"
          ffmpeg -v error -stats -y -i /tmp/vsl-src -vf "scale='min(1280,iw)':-2" -r 30 \
            -c:v libx264 -preset fast -threads 0 -b:v ${vb}k -maxrate $((vb*3/2))k -bufsize $((vb*3))k \
            -profile:v high -pix_fmt yuv420p -movflags +faststart \
            -c:a aac -b:a 96k -ac 2 public/video/vsl.mp4
          ls -la public/video/vsl.mp4
          echo "VSL: ${dur}s, vídeo ${vb} kbps → $(du -h public/video/vsl.mp4 | cut -f1)"
          echo "VSL_BUILD_ENV=--build-env NEXT_PUBLIC_VSL_MP4=/video/vsl.mp4" >> "$GITHUB_ENV"
          echo "VSL em MP4: $(du -h public/video/vsl.mp4 | cut -f1) (${dur}s)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy de produção
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prod --yes $VSL_BUILD_ENV --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Deploy Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Domínio curto
        id: alias
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for d in $SHORT_DOMAINS; do
            # registra como domínio de produção do projeto (ignora se já existir)
            curl -sS -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT/domains?slug=$VERCEL_SCOPE" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"name\":\"$d\"}" | head -c 300; echo
            if npx vercel@latest alias set "$url" "$d" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; then
              echo "domain=https://$d" >> "$GITHUB_OUTPUT"
              echo "Domínio curto: https://$d" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::$d indisponível, tentando o próximo"
          done
          echo "::error::Nenhum domínio curto disponível"; exit 1
      - name: URL
        run: |
          echo "Publicado em ${{ steps.deploy.outputs.url }}"
          echo "Domínio curto: ${{ steps.alias.outputs.domain }}"

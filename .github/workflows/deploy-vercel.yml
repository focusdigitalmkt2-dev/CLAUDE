# Deploy automático na Vercel a cada push na branch da landing page.
# Requer o secret VERCEL_TOKEN no repositório:
#   Settings → Secrets and variables → Actions → New repository secret
# O projeto é criado/vinculado automaticamente no time da Focus na Vercel.
name: Deploy landing page (Vercel)

on:
  push:
    branches: [claude/landing-page-secretarias-s4yy4w]
    paths: ["secretarias-alta-performance/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: focusdigitalmkt2-5069s-projects
  VERCEL_PROJECT: secretarias-alta-performance
  # Domínio curto (alias) apontado para a produção. Candidatos em ordem de preferência.
  SHORT_DOMAINS: "secretarias-focus.vercel.app secretariasfocus.vercel.app focus-secretarias.vercel.app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secretarias-alta-performance
    steps:
      - uses: actions/checkout@v4
      - name: Verificar secret VERCEL_TOKEN
        run: |
          # remove espaços e quebras de linha coladas junto com o token
          token="$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::Secret VERCEL_TOKEN não configurado no repositório."; exit 1
          fi
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vincular projeto na Vercel
        run: npx vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Liberar acesso público (desativa Vercel Authentication)
        run: |
          curl -sS -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT?slug=$VERCEL_SCOPE" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('ssoProtection:', d.get('ssoProtection'), '| erro:', d.get('error'))"
      - name: Deploy de produção
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Deploy Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Domínio curto
        id: alias
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for d in $SHORT_DOMAINS; do
            # registra como domínio de produção do projeto (ignora se já existir)
            curl -sS -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT/domains?slug=$VERCEL_SCOPE" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"name\":\"$d\"}" | head -c 300; echo
            if npx vercel@latest alias set "$url" "$d" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; then
              echo "domain=https://$d" >> "$GITHUB_OUTPUT"
              echo "Domínio curto: https://$d" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::$d indisponível, tentando o próximo"
          done
          echo "::error::Nenhum domínio curto disponível"; exit 1
      - name: URL
        run: |
          echo "Publicado em ${{ steps.deploy.outputs.url }}"
          echo "Domínio curto: ${{ steps.alias.outputs.domain }}"
